# Netlify Production Deployment Configuration
# Project: HB+ Intern Portal (Secure Cross-Platform Google Authentication App)

[build]
  publish = "dist"
  command = "npm run build:web"

# Single-Page Application (SPA) Client-Side Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Production Web
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
